<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="A focused issue board for turning plans into finished work with Codex."
    />
    <title>Taskboard</title>
    <script>
      (() => {
        const query = new URLSearchParams(window.location.search);
        const host = query.get("host");
        const embedded = host === "codex" || host === "workbuddy";
        const queryTheme = query.get("theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = !embedded && (queryTheme === "light" || queryTheme === "dark")
          ? queryTheme
          : systemDark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.embedded = String(embedded);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
