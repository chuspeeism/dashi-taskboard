name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  deployments: write

concurrency:
  group: release-macos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Validate release tag and versions
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      package_version: ${{ steps.validate.outputs.package_version }}
      release_version: ${{ steps.validate.outputs.release_version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Validate release tag and versions
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_CREATED: ${{ github.event.created }}
          TAG_DELETED: ${{ github.event.deleted }}
          TAG_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [[ "$TAG_CREATED" != "true" || "$TAG_DELETED" == "true" || "$TAG_FORCED" == "true" ]]; then
            echo "发布标签必须是首次创建，不能删除或强制更新。" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{}")"
          if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "标签提交与当前工作流提交不一致。" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

          REMOTE_TAG_COMMIT="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$REMOTE_TAG_COMMIT" ]]; then
            REMOTE_TAG_COMMIT="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ "$REMOTE_TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "远程发布标签与当前工作流提交不一致。" >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          CARGO_VERSION="$(node -e 'const fs=require("fs"); const source=fs.readFileSync("src-tauri/Cargo.toml","utf8"); console.log(source.match(/^version = "([^"]+)"/m)[1])')"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$PACKAGE_VERSION" != "$CARGO_VERSION" || "$PACKAGE_VERSION" != "$TAURI_VERSION" ]]; then
            echo "package.json、Cargo.toml 和 tauri.conf.json 的版本必须一致。" >&2
            exit 1
          fi
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Apple-facing 应用版本必须是纯数字 major.minor.patch。" >&2
            exit 1
          fi

          STABLE_TAG="v$PACKAGE_VERSION"
          BETA_PREFIX="$STABLE_TAG-beta."
          if [[ "$RELEASE_TAG" == "$STABLE_TAG" ]]; then
            RELEASE_VERSION="$PACKAGE_VERSION"
            RELEASE_CHANNEL="stable"
            PRERELEASE=false
            BETA_NUMBER=""
          elif [[ "$RELEASE_TAG" == "$BETA_PREFIX"* ]]; then
            BETA_NUMBER="${RELEASE_TAG#"$BETA_PREFIX"}"
            if [[ ! "$BETA_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "Beta 标签必须是 $BETA_PREFIX 加正整数。" >&2
              exit 1
            fi
            RELEASE_VERSION="$PACKAGE_VERSION-beta.$BETA_NUMBER"
            RELEASE_CHANNEL="beta"
            PRERELEASE=true
          else
            echo "发布标签必须是 $STABLE_TAG 或 $BETA_PREFIX<正整数>。" >&2
            exit 1
          fi

          RELEASE_CHECK="$RUNNER_TEMP/release-check.json"
          if ! RELEASE_STATUS="$(curl --silent --show-error \
            --output "$RELEASE_CHECK" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"; then
            echo "无法确认 Release 是否存在。" >&2
            exit 1
          fi
          case "$RELEASE_STATUS" in
            404) ;;
            200)
              echo "该标签或版本已存在 Release。" >&2
              exit 1
              ;;
            *)
              echo "查询 Release 失败，HTTP $RELEASE_STATUS。" >&2
              exit 1
              ;;
          esac

          RELEASES="$RUNNER_TEMP/releases.tsv"
          gh api \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.tag_name, .draft, .prerelease, (.immutable // false), .target_commitish] | @tsv' \
            > "$RELEASES"
          PACKAGE_VERSION="$PACKAGE_VERSION" \
          RELEASE_CHANNEL="$RELEASE_CHANNEL" \
          BETA_NUMBER="$BETA_NUMBER" \
          RELEASES="$RELEASES" \
          GITHUB_SHA="$GITHUB_SHA" \
          node <<'NODE'
          const fs = require("node:fs");
          const current = process.env.PACKAGE_VERSION.split(".").map(Number);
          const releases = fs.readFileSync(process.env.RELEASES, "utf8")
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => {
              const [tag, draft, prerelease, immutable, target] = line.split("\t");
              return {
                tag,
                draft: draft === "true",
                prerelease: prerelease === "true",
                immutable: immutable === "true",
                target,
              };
            });
          const compare = (left, right) => {
            for (let index = 0; index < Math.max(left.length, right.length); index += 1) {
              const difference = (left[index] ?? 0) - (right[index] ?? 0);
              if (difference !== 0) return difference;
            }
            return 0;
          };
          for (const release of releases) {
            const match = /^(?:app-)?v(\d+(?:\.\d+)*)$/.exec(release.tag);
            if (match && compare(match[1].split(".").map(Number), current) >= 0) {
              console.error(`已有相同或更高版本的稳定 Release：${release.tag}`);
              process.exit(1);
            }

            if (process.env.RELEASE_CHANNEL === "beta") {
              const betaMatch = /^v(\d+(?:\.\d+)*)-beta\.([1-9]\d*)$/.exec(release.tag);
              if (betaMatch) {
                const baseComparison = compare(betaMatch[1].split(".").map(Number), current);
                const betaComparison = BigInt(betaMatch[2]) >= BigInt(process.env.BETA_NUMBER);
                if (baseComparison > 0 || (baseComparison === 0 && betaComparison)) {
                  console.error(`已有相同或更高版本的 Beta Release：${release.tag}`);
                  process.exit(1);
                }
              }
            }
          }

          if (process.env.RELEASE_CHANNEL === "stable") {
            const confirmedBeta = releases.some((release) => {
              const betaMatch = /^v(\d+(?:\.\d+)*)-beta\.([1-9]\d*)$/.exec(release.tag);
              return betaMatch?.[1] === process.env.PACKAGE_VERSION
                && release.draft === false
                && release.prerelease === true
                && release.immutable === true
                && release.target === process.env.GITHUB_SHA;
            });
            if (!confirmedBeta) {
              console.error("正式发布前必须先发布同一提交、同一版本的 immutable Beta Release。");
              process.exit(1);
            }
          }
          NODE
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  release-linux:
    name: Build Ubuntu 24.04 x64 packages
    needs: release-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CODEX_TASKBOARD_RELEASE_VERSION: ${{ needs['release-preflight'].outputs.release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: ubuntu-24.04-x64
          cache-bin: false

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install dependencies
        run: npm ci

      - name: Build Ubuntu 24.04 x64 packages and updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          npm run app:build:linux:x64 --
          --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Verify Ubuntu 24.04 x64 package contents
        run: >-
          node scripts/verify-linux-packages.mjs
          src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

      - name: Stage Ubuntu 24.04 x64 release assets
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LINUX_RELEASE="$RUNNER_TEMP/linux-release"
          mkdir -p "$LINUX_RELEASE"
          cp \
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb \
            "$LINUX_RELEASE/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.deb"
          cp \
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sig \
            "$LINUX_RELEASE/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.deb.sig"
          cp \
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage \
            "$LINUX_RELEASE/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.AppImage"
          cp \
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig \
            "$LINUX_RELEASE/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.AppImage.sig"

      - name: Preserve Ubuntu 24.04 x64 release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-${{ github.sha }}
          path: ${{ runner.temp }}/linux-release
          if-no-files-found: error

  release-windows-preview:
    name: Build unsigned Windows x64 Preview
    needs: release-preflight
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CODEX_TASKBOARD_RELEASE_VERSION: ${{ needs['release-preflight'].outputs.release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-x64
          cache-bin: false

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows x64 Preview
        run: npm run app:build:windows

      - name: Preserve unsigned Windows x64 Preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-preview-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release-macos:
    name: Build signed universal macOS app
    needs: release-preflight
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CODEX_TASKBOARD_RELEASE_VERSION: ${{ needs['release-preflight'].outputs.release_version }}
      RELEASE_TAG: ${{ needs['release-preflight'].outputs.release_tag }}
      PACKAGE_VERSION: ${{ needs['release-preflight'].outputs.package_version }}
      APP_NAME: ${{ needs['release-preflight'].outputs.prerelease == 'true' && 'Codex Taskboard Beta.app' || 'Codex Taskboard.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Remove unused preinstalled Rust toolchain
        run: rustup toolchain uninstall stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-universal
          cache-bin: false

      - name: Install dependencies
        run: npm ci

      - name: Prepare universal app resources
        run: npm run app:prepare -- --target universal-apple-darwin

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codex-taskboard-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          APPLE_API_KEY_PATH="$RUNNER_TEMP/app-store-connect.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build unsigned universal App and DMG layout
        run: >-
          CI=true node scripts/tauri-build.mjs
          --target universal-apple-darwin
          --bundles app,dmg
          --no-sign
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Sign App with separate Node.js policy
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/sign-macos-app.mjs "src-tauri/target/universal-apple-darwin/release/bundle/macos/$APP_NAME"

      - name: Notarize and staple App
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/$APP_NAME"
          APP_ZIP="$RUNNER_TEMP/Codex.Taskboard.app.zip"
          /usr/bin/ditto -c -k --keepParent --sequesterRsrc "$APP_PATH" "$APP_ZIP"
          xcrun notarytool submit "$APP_ZIP" \
            --key-id "$APPLE_API_KEY" \
            --key "$APPLE_API_KEY_PATH" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple -v "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl -a -t exec -vv "$APP_PATH"

      - name: Create, sign, notarize, and staple DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          RAW_DMG_NAME="${APP_NAME%.app}_${PACKAGE_VERSION}_universal.dmg"
          RELEASE_DMG_NAME="Codex.Taskboard_${PACKAGE_VERSION}_universal.dmg"
          rm -f "$BUNDLE_ROOT/dmg/$RAW_DMG_NAME" "$BUNDLE_ROOT/macos/$RAW_DMG_NAME"
          (
            cd "$BUNDLE_ROOT/macos"
            ../dmg/bundle_dmg.sh \
              --volname "Codex Taskboard" \
              --icon "$APP_NAME" 180 170 \
              --app-drop-link 480 170 \
              --window-size 660 400 \
              --hide-extension "$APP_NAME" \
              --volicon ../dmg/icon.icns \
              --skip-jenkins \
              "$RAW_DMG_NAME" "$APP_NAME"
          )
          mv "$BUNDLE_ROOT/macos/$RAW_DMG_NAME" "$BUNDLE_ROOT/dmg/$RELEASE_DMG_NAME"
          DMG_PATH="$BUNDLE_ROOT/dmg/$RELEASE_DMG_NAME"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key-id "$APPLE_API_KEY" \
            --key "$APPLE_API_KEY_PATH" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple -v "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          spctl -a -t open --context context:primary-signature -vv "$DMG_PATH"

      - name: Create signed updater files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          node scripts/create-macos-updater.mjs \
            "$BUNDLE_ROOT/macos/$APP_NAME" \
            "$BUNDLE_ROOT/release" \
            "$RELEASE_TAG"

      - name: Verify signed release artifacts
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          APP_PATH="$BUNDLE_ROOT/macos/$APP_NAME"
          DMG_PATH="$BUNDLE_ROOT/dmg/Codex.Taskboard_${PACKAGE_VERSION}_universal.dmg"
          RELEASE_ROOT="$BUNDLE_ROOT/release"
          npm run app:verify-release -- "$APP_PATH" "$DMG_PATH" "$RELEASE_ROOT" "$RELEASE_TAG"

      - name: Stage final public macOS release assets
        run: |
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          MACOS_RELEASE="$RUNNER_TEMP/macos-release"
          mkdir -p "$MACOS_RELEASE"
          cp \
            "$BUNDLE_ROOT/dmg/Codex.Taskboard_${PACKAGE_VERSION}_universal.dmg" \
            "$MACOS_RELEASE/Codex.Taskboard_${PACKAGE_VERSION}_macOS-universal.dmg"
          cp "$BUNDLE_ROOT/release/Codex.Taskboard_${PACKAGE_VERSION}_universal.app.tar.gz" "$MACOS_RELEASE/"
          cp "$BUNDLE_ROOT/release/Codex.Taskboard_${PACKAGE_VERSION}_universal.app.tar.gz.sig" "$MACOS_RELEASE/"
          cp "$BUNDLE_ROOT/release/latest.json" "$MACOS_RELEASE/"

      - name: Preserve final public macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-${{ github.sha }}
          path: ${{ runner.temp }}/macos-release
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/codex-taskboard-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
          rm -f "$RUNNER_TEMP/app-store-connect.p8"

  draft-release:
    name: Create draft release
    needs:
      - release-preflight
      - release-linux
      - release-windows-preview
      - release-macos
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs['release-preflight'].outputs.release_tag }}
      PACKAGE_VERSION: ${{ needs['release-preflight'].outputs.package_version }}
      PRERELEASE: ${{ needs['release-preflight'].outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Restore final public macOS release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release-${{ github.sha }}
          path: ${{ runner.temp }}/macos-release

      - name: Restore unsigned Windows x64 Preview
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-preview-${{ github.sha }}
          path: ${{ runner.temp }}/windows-preview

      - name: Restore Ubuntu 24.04 x64 release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-${{ github.sha }}
          path: ${{ runner.temp }}/linux-release

      - name: Add and verify the Linux x64 updater
        run: |
          LATEST_PATH="$RUNNER_TEMP/macos-release/latest.json"
          LINUX_DEB_NAME="Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.deb"
          LINUX_APPIMAGE_NAME="Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.AppImage"
          LINUX_DEB="$RUNNER_TEMP/linux-release/$LINUX_DEB_NAME"
          LINUX_APPIMAGE="$RUNNER_TEMP/linux-release/$LINUX_APPIMAGE_NAME"
          jq \
            --rawfile deb_signature "$LINUX_DEB.sig" \
            --rawfile appimage_signature "$LINUX_APPIMAGE.sig" \
            --arg deb_url "https://github.com/chuspeeism/dashi-taskboard/releases/download/$RELEASE_TAG/$LINUX_DEB_NAME" \
            --arg appimage_url "https://github.com/chuspeeism/dashi-taskboard/releases/download/$RELEASE_TAG/$LINUX_APPIMAGE_NAME" \
            '.platforms["linux-x86_64-deb"] = {signature: $deb_signature, url: $deb_url}
             | .platforms["linux-x86_64-appimage"] = {signature: $appimage_signature, url: $appimage_url}' \
            "$LATEST_PATH" > "$LATEST_PATH.linux"
          mv "$LATEST_PATH.linux" "$LATEST_PATH"
          node scripts/verify-linux-updater.mjs \
            "$LINUX_DEB" \
            "$LINUX_APPIMAGE" \
            "$LATEST_PATH" \
            "$RELEASE_TAG"

      - name: Create trusted release asset manifest
        run: |
          set -euo pipefail
          MACOS_RELEASE="$RUNNER_TEMP/macos-release"
          RELEASE_ASSETS="$RUNNER_TEMP/release-assets"
          MANIFEST_ROOT="$RUNNER_TEMP/release-manifest"
          mkdir -p "$RELEASE_ASSETS" "$MANIFEST_ROOT"
          cp "$MACOS_RELEASE/Codex.Taskboard_${PACKAGE_VERSION}_macOS-universal.dmg" "$RELEASE_ASSETS/"
          cp "$MACOS_RELEASE/Codex.Taskboard_${PACKAGE_VERSION}_universal.app.tar.gz" "$RELEASE_ASSETS/"
          cp "$MACOS_RELEASE/Codex.Taskboard_${PACKAGE_VERSION}_universal.app.tar.gz.sig" "$RELEASE_ASSETS/"
          cp "$MACOS_RELEASE/latest.json" "$RELEASE_ASSETS/"
          cp \
            "$RUNNER_TEMP/windows-preview/"*-setup.exe \
            "$RELEASE_ASSETS/Codex.Taskboard_${PACKAGE_VERSION}_NSIS-x64-unsigned.exe"
          cp \
            "$RUNNER_TEMP/linux-release/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.deb" \
            "$RELEASE_ASSETS/"
          cp \
            "$RUNNER_TEMP/linux-release/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.deb.sig" \
            "$RELEASE_ASSETS/"
          cp \
            "$RUNNER_TEMP/linux-release/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.AppImage" \
            "$RELEASE_ASSETS/"
          cp \
            "$RUNNER_TEMP/linux-release/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.AppImage.sig" \
            "$RELEASE_ASSETS/"
          (
            cd "$RELEASE_ASSETS"
            shasum -a 256 \
              "Codex.Taskboard_${PACKAGE_VERSION}_macOS-universal.dmg" \
              "Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.deb" \
              "Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.deb.sig" \
              "Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.AppImage" \
              "Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.AppImage.sig" \
              "Codex.Taskboard_${PACKAGE_VERSION}_NSIS-x64-unsigned.exe" \
              "Codex.Taskboard_${PACKAGE_VERSION}_universal.app.tar.gz" \
              "Codex.Taskboard_${PACKAGE_VERSION}_universal.app.tar.gz.sig" \
              "latest.json" > "$MANIFEST_ROOT/release-assets.sha256"
          )

      - name: Preserve trusted release asset manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-${{ github.sha }}-sha256
          path: ${{ runner.temp }}/release-manifest/release-assets.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ASSETS="$RUNNER_TEMP/release-assets"
          RELEASE_FLAGS=(--draft)
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          elif [[ "$PRERELEASE" != "false" ]]; then
            echo "无效的 prerelease 状态：$PRERELEASE" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            "${RELEASE_FLAGS[@]}" \
            --title "Codex Taskboard $RELEASE_TAG" \
            --generate-notes \
            "$RELEASE_ASSETS/Codex.Taskboard_${PACKAGE_VERSION}_macOS-universal.dmg"
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$RELEASE_ASSETS/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.deb" \
            "$RELEASE_ASSETS/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.deb.sig" \
            "$RELEASE_ASSETS/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.AppImage" \
            "$RELEASE_ASSETS/Codex.Taskboard_${PACKAGE_VERSION}_Ubuntu-24.04-x64.AppImage.sig" \
            "$RELEASE_ASSETS/Codex.Taskboard_${PACKAGE_VERSION}_NSIS-x64-unsigned.exe" \
            "$RELEASE_ASSETS/Codex.Taskboard_${PACKAGE_VERSION}_universal.app.tar.gz" \
            "$RELEASE_ASSETS/Codex.Taskboard_${PACKAGE_VERSION}_universal.app.tar.gz.sig" \
            "$RELEASE_ASSETS/latest.json"

  promote-release:
    name: Verify and publish immutable release
    needs:
      - release-preflight
      - draft-release
    if: ${{ !cancelled() && needs['release-preflight'].result == 'success' && needs['draft-release'].result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: macos-release
    env:
      RELEASE_TAG: ${{ needs['release-preflight'].outputs.release_tag }}
      PACKAGE_VERSION: ${{ needs['release-preflight'].outputs.package_version }}
      EXPECTED_PRERELEASE: ${{ needs['release-preflight'].outputs.prerelease }}

    steps:
      - name: Validate protected release promotion
        env:
          RULESET_TOKEN: ${{ secrets.RELEASE_RULESET_TOKEN }}
        run: |
          set -euo pipefail
          API_VERSION_HEADER="X-GitHub-Api-Version: 2026-03-10"
          if [[ "$EXPECTED_PRERELEASE" != "true" && "$EXPECTED_PRERELEASE" != "false" ]]; then
            echo "promotion 收到无效的 prerelease 状态。" >&2
            exit 1
          fi
          if [[ -z "$RULESET_TOKEN" ]]; then
            echo "缺少 RELEASE_RULESET_TOKEN，无法确认标签 Ruleset 的绕过者。" >&2
            exit 1
          fi
          if ! RULESET_IDS="$(GH_TOKEN="$RULESET_TOKEN" gh api \
            --header "$API_VERSION_HEADER" \
            --paginate \
            "repos/$GITHUB_REPOSITORY/rulesets?targets=tag&per_page=100" \
            --jq '.[].id')"; then
            echo "无法读取标签 Ruleset。" >&2
            exit 1
          fi

          TAG_RULE_PROTECTED=false
          while IFS= read -r RULESET_ID; do
            [[ -n "$RULESET_ID" ]] || continue
            if ! RULESET="$(GH_TOKEN="$RULESET_TOKEN" gh api \
              --header "$API_VERSION_HEADER" \
              "repos/$GITHUB_REPOSITORY/rulesets/$RULESET_ID")"; then
              echo "无法读取标签 Ruleset $RULESET_ID。" >&2
              exit 1
            fi
            if jq -e --arg tag_ref "refs/tags/$RELEASE_TAG" '
              .target == "tag" and
              .enforcement == "active" and
              has("bypass_actors") and
              ((.bypass_actors | type) == "array") and
              ((.bypass_actors | length) == 0) and
              ((.conditions.ref_name.include | type) == "array") and
              any(
                .conditions.ref_name.include[]?;
                . == $tag_ref or
                (
                  . == "refs/tags/v*" and
                  ($tag_ref | test("^refs/tags/v[^/]*$"))
                )
              ) and
              ((.conditions.ref_name.exclude | type) == "array") and
              ((.conditions.ref_name.exclude | length) == 0) and
              ((.rules | type) == "array") and
              any(.rules[]?; .type == "update") and
              any(.rules[]?; .type == "deletion")
            ' <<< "$RULESET" >/dev/null; then
              TAG_RULE_PROTECTED=true
              break
            fi
          done <<< "$RULESET_IDS"
          if [[ "$TAG_RULE_PROTECTED" != "true" ]]; then
            echo "发布前必须启用覆盖当前标签的规则：exclude 为空、禁止更新和删除，并且 bypass_actors 字段可见且为空。" >&2
            exit 1
          fi

          if ! IMMUTABLE_RELEASES="$(GH_TOKEN="$RULESET_TOKEN" gh api \
            --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/immutable-releases")"; then
            echo "仓库必须在 promotion 前启用 immutable releases。" >&2
            exit 1
          fi
          if ! jq -e '.enabled == true' <<< "$IMMUTABLE_RELEASES" >/dev/null; then
            echo "仓库的 immutable releases 未启用。" >&2
            exit 1
          fi

      - name: Restore trusted release asset manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release-${{ github.sha }}-sha256
          path: ${{ runner.temp }}/trusted-release-manifest

      - name: Verify Draft Release digests and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_VERSION_HEADER="X-GitHub-Api-Version: 2026-03-10"
          MANIFEST_PATH="$RUNNER_TEMP/trusted-release-manifest/release-assets.sha256"
          LATEST_PATH="$RUNNER_TEMP/release-latest.json"
          FIRST_ASSET_NAME="Codex.Taskboard_${PACKAGE_VERSION}_macOS-universal.dmg"
          RELEASES="$(gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          DRAFT_RELEASE="$(jq -c \
            --arg tag "$RELEASE_TAG" \
            '[.[] | select(.tag_name == $tag and .draft == true)] | if length == 1 then .[0] else empty end' \
            <<< "$RELEASES")"
          if [[ -z "$DRAFT_RELEASE" ]]; then
            echo "找不到唯一的目标 Draft Release。" >&2
            exit 1
          fi
          EXPECTED_ASSET_COUNT="$(wc -l < "$MANIFEST_PATH" | tr -d ' ')"

          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg target "$GITHUB_SHA" \
            --arg first_asset "$FIRST_ASSET_NAME" \
            --argjson prerelease "$EXPECTED_PRERELEASE" \
            --argjson asset_count "$EXPECTED_ASSET_COUNT" \
            '.tag_name == $tag and
             .target_commitish == $target and
             .draft == true and
             .prerelease == $prerelease and
             (.assets | length) == $asset_count and
             .assets[0].name == $first_asset and
             all(.assets[]; .state == "uploaded")' \
            <<< "$DRAFT_RELEASE" >/dev/null; then
            echo "发布前 Draft Release、通道、DMG 首位或资产集合发生变化。" >&2
            exit 1
          fi

          while read -r SHA256 ASSET_NAME; do
            if ! jq -e \
              --arg name "$ASSET_NAME" \
              --arg digest "sha256:$SHA256" \
              'any(.assets[]; .name == $name and .digest == $digest)' \
              <<< "$DRAFT_RELEASE" >/dev/null; then
              echo "发布前资产 $ASSET_NAME 的 SHA-256 与构建 manifest 不一致。" >&2
              exit 1
            fi
          done < "$MANIFEST_PATH"

          if ! REMOTE_TAG_COMMIT="$(gh api \
            --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" \
            --jq '.sha')"; then
            echo "发布前无法重新读取远程标签。" >&2
            exit 1
          fi
          if [[ "$REMOTE_TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "发布前远程标签与构建提交不一致。" >&2
            exit 1
          fi

          LATEST_ASSET_ID="$(jq -r \
            '[.assets[] | select(.name == "latest.json")] | if length == 1 then .[0].id else empty end' \
            <<< "$DRAFT_RELEASE")"
          EXPECTED_LATEST_SHA256="$(awk '$2 == "latest.json" { print $1 }' "$MANIFEST_PATH")"
          if [[ -z "$LATEST_ASSET_ID" || -z "$EXPECTED_LATEST_SHA256" ]]; then
            echo "Draft Release 或 manifest 缺少唯一的 latest.json。" >&2
            exit 1
          fi
          gh api \
            --header "$API_VERSION_HEADER" \
            --header "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$LATEST_ASSET_ID" \
            > "$LATEST_PATH"
          ACTUAL_LATEST_SHA256="$(sha256sum "$LATEST_PATH" | awk '{ print $1 }')"
          if [[ "$ACTUAL_LATEST_SHA256" != "$EXPECTED_LATEST_SHA256" ]]; then
            echo "下载的 latest.json 与构建 manifest 不一致。" >&2
            exit 1
          fi
          jq -e . "$LATEST_PATH" >/dev/null

          RELEASE_ID="$(jq -r '.id' <<< "$DRAFT_RELEASE")"
          gh api --header "$API_VERSION_HEADER" \
            --method PATCH \
            -F draft=false \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >/dev/null

      - name: Verify final immutable Release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_VERSION_HEADER="X-GitHub-Api-Version: 2026-03-10"
          MANIFEST_PATH="$RUNNER_TEMP/trusted-release-manifest/release-assets.sha256"
          FIRST_ASSET_NAME="Codex.Taskboard_${PACKAGE_VERSION}_macOS-universal.dmg"
          FINAL_RELEASE="$(gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          LATEST_RELEASE="$(gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/releases/latest")"
          EXPECTED_ASSET_COUNT="$(wc -l < "$MANIFEST_PATH" | tr -d ' ')"

          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg target "$GITHUB_SHA" \
            --arg first_asset "$FIRST_ASSET_NAME" \
            --argjson prerelease "$EXPECTED_PRERELEASE" \
            --argjson asset_count "$EXPECTED_ASSET_COUNT" \
            '.tag_name == $tag and
             .target_commitish == $target and
             .draft == false and
             .prerelease == $prerelease and
             .immutable == true and
             (.assets | length) == $asset_count and
             .assets[0].name == $first_asset and
             all(.assets[]; .state == "uploaded")' \
            <<< "$FINAL_RELEASE" >/dev/null; then
            echo "最终 Release 的发布、通道、锁定、DMG 首位或资产状态不正确。" >&2
            exit 1
          fi

          if [[ "$EXPECTED_PRERELEASE" == "true" ]]; then
            if ! jq -e --arg tag "$RELEASE_TAG" \
              '.draft == false and .prerelease == false and .tag_name != $tag' \
              <<< "$LATEST_RELEASE" >/dev/null; then
              echo "Beta Release 不得成为 GitHub latest。" >&2
              exit 1
            fi
          elif ! jq -e --arg tag "$RELEASE_TAG" \
            '.draft == false and .prerelease == false and .tag_name == $tag' \
            <<< "$LATEST_RELEASE" >/dev/null; then
            echo "正式 Release 必须成为 GitHub latest。" >&2
            exit 1
          fi

          while read -r SHA256 ASSET_NAME; do
            if ! jq -e \
              --arg name "$ASSET_NAME" \
              --arg digest "sha256:$SHA256" \
              'any(.assets[]; .name == $name and .digest == $digest)' \
              <<< "$FINAL_RELEASE" >/dev/null; then
              echo "最终资产 $ASSET_NAME 的 SHA-256 与构建 manifest 不一致。" >&2
              exit 1
            fi
          done < "$MANIFEST_PATH"

      - name: Update and verify Beta updater metadata
        if: env.EXPECTED_PRERELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_VERSION_HEADER="X-GitHub-Api-Version: 2026-03-10"
          BETA_FEED_BRANCH="beta-updater"
          BETA_FEED_PATH="latest.json"
          LATEST_PATH="$RUNNER_TEMP/release-latest.json"
          REMOTE_LATEST_PATH="$RUNNER_TEMP/beta-updater-latest.json"

          if ! gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$BETA_FEED_BRANCH" >/dev/null 2>&1; then
            gh api --header "$API_VERSION_HEADER" \
              --method POST \
              -f ref="refs/heads/$BETA_FEED_BRANCH" \
              -f sha="$GITHUB_SHA" \
              "repos/$GITHUB_REPOSITORY/git/refs" >/dev/null
          fi

          FILE_SHA="$(gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/contents/$BETA_FEED_PATH?ref=$BETA_FEED_BRANCH" \
            --jq '.sha' 2>/dev/null || true)"
          CONTENT="$(base64 < "$LATEST_PATH" | tr -d '\n')"
          UPDATE_ARGS=(
            --method PUT
            -f "message=Update Beta updater metadata for $RELEASE_TAG"
            -f "content=$CONTENT"
            -f "branch=$BETA_FEED_BRANCH"
          )
          if [[ -n "$FILE_SHA" ]]; then
            UPDATE_ARGS+=(-f "sha=$FILE_SHA")
          fi
          UPDATE_RESULT="$(gh api --header "$API_VERSION_HEADER" \
            "${UPDATE_ARGS[@]}" \
            "repos/$GITHUB_REPOSITORY/contents/$BETA_FEED_PATH")"
          UPDATED_FILE_SHA="$(jq -r '.content.sha // empty' <<< "$UPDATE_RESULT")"
          if [[ -z "$UPDATED_FILE_SHA" ]]; then
            echo "Beta updater metadata 更新未返回文件 SHA。" >&2
            exit 1
          fi

          REMOTE_FILE="$(gh api --header "$API_VERSION_HEADER" \
            "repos/$GITHUB_REPOSITORY/contents/$BETA_FEED_PATH?ref=$BETA_FEED_BRANCH")"
          if [[ "$(jq -r '.sha // empty' <<< "$REMOTE_FILE")" != "$UPDATED_FILE_SHA" ]]; then
            echo "Beta updater metadata 回读 SHA 与写入结果不一致。" >&2
            exit 1
          fi
          jq -r '.content' <<< "$REMOTE_FILE" \
            | tr -d '\n' \
            | base64 --decode \
            > "$REMOTE_LATEST_PATH"
          if ! cmp -s "$LATEST_PATH" "$REMOTE_LATEST_PATH"; then
            echo "Beta updater metadata 回读内容与已验证 Release metadata 不一致。" >&2
            exit 1
          fi
